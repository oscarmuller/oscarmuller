<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentist Office Entry</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="language-switch">
        <button id="language-btn">Español</button>
    </div>
    <div class="form-container">
        <h1>Dentist Office Entry</h1>
        <form id="entry-form">
            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" name="full-name" required>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>

            <label for="insurance-info">Medical Insurance Information:</label>
            <input type="text" id="insurance-info" name="insurance-info" required>

            <label for="phone-number">Phone Number:</label>
            <input type="tel" id="phone-number" name="phone-number" required>

            <button type="submit">Submit</button>
        </form>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
